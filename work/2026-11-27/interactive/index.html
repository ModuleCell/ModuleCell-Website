<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five Tastes Shibori · 五味紮染</title>
  <style>
    :root {
      --cloth: #FAF9F6;
      --ink: #161614;
      --muted: rgba(22, 22, 20, 0.56);
      --hairline: rgba(22, 22, 20, 0.14);
      --glass: rgba(250, 249, 246, 0.82);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--cloth);
      color: var(--ink);
      font-family: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    .header {
      position: fixed;
      top: 22px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.35s ease;
    }

    .brand h1 {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .top-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .food-form {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 5px 4px 13px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--hairline);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .food-form:focus-within {
      border-color: rgba(22, 22, 20, 0.36);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .food-input {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      width: 205px;
      outline: none;
    }

    .food-input::placeholder { color: var(--muted); }

    .food-submit {
      appearance: none;
      border: 1px solid var(--hairline);
      background: rgba(22, 22, 20, 0.06);
      color: var(--ink);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s ease, transform 0.12s ease;
    }

    .food-submit:hover { background: rgba(22, 22, 20, 0.12); }
    .food-submit:active { transform: scale(0.97); }

    .text-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .text-btn:hover { color: var(--ink); border-bottom-color: var(--hairline); }

    /* Bottom Left: Single-Row Mode Switcher + Rainbow Dye Palette */
    .left-dock {
      position: fixed;
      left: 28px;
      bottom: 22px;
      z-index: 10;
      display: flex;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      transition: opacity 0.35s ease;
    }

    .mode-bar,
    .color-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--hairline);
    }

    .mode-bar { gap: 4px; padding: 5px 8px; }

    .mode-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11.5px;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .mode-btn:hover { color: var(--ink); background: rgba(22, 22, 20, 0.06); }
    .mode-btn.active {
      color: var(--ink);
      font-weight: 500;
      background: rgba(22, 22, 20, 0.09);
      border-color: var(--hairline);
    }

    .color-label {
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-right: 2px;
      white-space: nowrap;
    }

    .swatch-btn {
      appearance: none;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1.5px solid rgba(22, 22, 20, 0.18);
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.45), 0 1px 2px rgba(0, 0, 0, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .swatch-btn:hover { transform: scale(1.12); }
    .swatch-btn.active {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px var(--cloth), 0 0 0 3.5px var(--ink);
      transform: scale(1.06);
    }

    .custom-color-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 3px;
      padding-left: 9px;
      border-left: 1px solid var(--hairline);
    }

    #customColor {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 1.5px solid rgba(22, 22, 20, 0.24);
      border-radius: 50%;
      background: conic-gradient(#E6006B, #FF6B00, #F0C808, #19A974, #1CA3EC, #274C77, #7B2CBF, #E6006B);
      cursor: pointer;
      padding: 0;
      overflow: hidden;
    }

    #customColor::-webkit-color-swatch-wrapper { padding: 0; }
    #customColor::-webkit-color-swatch { border: none; border-radius: 50%; }
    #customColor::-moz-color-swatch { border: none; border-radius: 50%; }

    .hex-readout {
      font-size: 10.5px;
      font-family: "IBM Plex Mono", "Inter", monospace;
      color: var(--muted);
      letter-spacing: 0.04em;
      min-width: 54px;
    }

    /* Bottom Right Studio Actions */
    .studio-actions {
      position: fixed;
      right: 28px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--hairline);
      transition: opacity 0.35s ease;
    }

    .act-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11.5px;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .act-btn:hover { color: var(--ink); background: rgba(22, 22, 20, 0.07); }
    .act-btn.primary { color: var(--ink); border-color: var(--hairline); }

    .toast {
      position: fixed;
      top: 72px;
      right: 28px;
      padding: 7px 13px;
      border-radius: 10px;
      background: var(--glass);
      border: 1px solid var(--hairline);
      backdrop-filter: blur(10px);
      font-size: 11.5px;
      color: var(--ink);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
      z-index: 20;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    body.ui-hidden .header,
    body.ui-hidden .left-dock,
    body.ui-hidden .studio-actions {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 1240px) {
      .hex-readout, .color-label { display: none; }
      .left-dock { left: 16px; bottom: 18px; gap: 6px; }
      .mode-bar { padding: 5px 6px; gap: 2px; }
      .mode-btn { padding: 5px 8px; font-size: 11px; gap: 4px; }
      .color-bar { padding: 6px 9px; gap: 6px; }
      .swatch-btn { width: 19px; height: 19px; }
      .studio-actions { right: 16px; bottom: 18px; padding: 6px 8px; gap: 4px; }
      .act-btn { padding: 5px 8px; font-size: 11px; }
    }

    @media (max-width: 900px) {
      .header { top: 14px; left: 16px; right: 16px; flex-direction: column; gap: 10px; }
      .food-input { width: 170px; }
      .left-dock { left: 16px; bottom: 66px; flex-wrap: wrap; }
      .studio-actions { right: 16px; bottom: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="header">
    <div class="brand">
      <h1 id="titleEl">Cloud Shibori · 雲霧紮染</h1>
      <div class="sub" id="subEl">點擊或輕滑滴入色霧，看染料沿棉布雲紋自然暈開並靜止 · [R] 重新雲染 · [C] 換新棉布 · [H] 隱藏介面</div>
    </div>
    <div class="top-right">
      <form class="food-form" id="foodForm" autocomplete="off">
        <input
          type="text"
          id="foodInput"
          class="food-input"
          placeholder="輸入食物，如：薄荷蘇打、草莓奶昔、藍莓…"
          aria-label="輸入食物讓 AI 雲霧紮染"
        />
        <button type="submit" class="food-submit" id="btnFoodPaint">AI 雲染</button>
      </form>
      <button class="text-btn" id="btnLang">EN</button>
    </div>
  </header>

  <div class="left-dock">
    <div class="mode-bar" role="radiogroup" aria-label="Five Tastes Dyeing Technique">
      <button class="mode-btn" data-mode="2" id="btnModeSour" title="酸 · 同心圓紮染 (Sour · Concentric Rings)">◎ <span class="lbl">酸</span></button>
      <button class="mode-btn active" data-mode="0" id="btnModeSweet" title="甜 · 雲霧暈染 (Sweet · Cloud Mist)">☁ <span class="lbl">甜</span></button>
      <button class="mode-btn" data-mode="1" id="btnModeBitter" title="苦 · 潑墨水韻 (Bitter · Splashed Ink)">✦ <span class="lbl">苦</span></button>
      <button class="mode-btn" data-mode="4" id="btnModeSpicy" title="辣 · 不規則點狀噴霧 (Spicy · Mist Spray)">∴ <span class="lbl">辣</span></button>
      <button class="mode-btn" data-mode="3" id="btnModeSalty" title="鹹 · 帶狀潮汐暈染 (Salty · Ribbon Wash)">〰 <span class="lbl">鹹</span></button>
    </div>
    <div class="color-bar" id="colorBar" aria-label="Rainbow Dye Palette">
      <span class="color-label" id="colorLabel">染料色</span>
      <button class="swatch-btn" data-hex="#E6006B" style="background:#E6006B" title="Red / Pink · 紅"></button>
      <button class="swatch-btn" data-hex="#FF6B00" style="background:#FF6B00" title="Orange · 橙"></button>
      <button class="swatch-btn" data-hex="#F0C808" style="background:#F0C808" title="Yellow · 黃"></button>
      <button class="swatch-btn" data-hex="#2EC4B6" style="background:#2EC4B6" title="Mint Green · 綠"></button>
      <button class="swatch-btn active" data-hex="#28B5F4" style="background:#28B5F4" title="Sky Blue · 藍"></button>
      <button class="swatch-btn" data-hex="#2B4C7E" style="background:#2B4C7E" title="Indigo · 靛"></button>
      <button class="swatch-btn" data-hex="#8338EC" style="background:#8338EC" title="Violet · 紫"></button>
      <button class="swatch-btn" data-hex="#18181B" style="background:#18181B" title="Sumi Ink · 墨黑"></button>
      <div class="custom-color-wrap">
        <input type="color" id="customColor" value="#28B5F4" title="自訂任意染料色" aria-label="Custom dye color picker" />
        <span class="hex-readout" id="hexReadout">#28B5F4</span>
      </div>
    </div>
  </div>

  <div class="studio-actions">
    <button class="act-btn" id="btnAuto">自動雲染</button>
    <button class="act-btn" id="btnClear">換新棉布</button>
    <button class="act-btn primary" id="btnExport">匯出染布</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // =========================================================================
    // Cloud Shibori · 雲霧紮染 (Focused Single-Effect Study)
    // Pure Ice-Dye / Cloud Tie-Dye on Soft Crinkled White Cotton Cloth (WebGL)
    // =========================================================================

    const MAX_CLOUDS = 48;

    const params = new URLSearchParams(window.location.search);
    const qLang = params.get('lang');
    let lang = (qLang === 'en' || qLang === 'zh')
      ? qLang
      : ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');

    const canvas = document.getElementById('stage');
    const gl = canvas.getContext('webgl', { antialias: true, alpha: false, preserveDrawingBuffer: true });
    if (!gl) {
      document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif">WebGL is required for Cloud Shibori.</div>';
      throw new Error('WebGL unavailable');
    }

    const titleEl = document.getElementById('titleEl');
    const subEl = document.getElementById('subEl');
    const foodForm = document.getElementById('foodForm');
    const foodInput = document.getElementById('foodInput');
    const btnFoodPaint = document.getElementById('btnFoodPaint');
    const colorLabelEl = document.getElementById('colorLabel');
    const customColorEl = document.getElementById('customColor');
    const hexReadoutEl = document.getElementById('hexReadout');
    const swatchBtns = Array.from(document.querySelectorAll('.swatch-btn'));
    const modeBtns = Array.from(document.querySelectorAll('.mode-btn'));
    const btnModeSour = document.getElementById('btnModeSour');
    const btnModeSweet = document.getElementById('btnModeSweet');
    const btnModeBitter = document.getElementById('btnModeBitter');
    const btnModeSpicy = document.getElementById('btnModeSpicy');
    const btnModeSalty = document.getElementById('btnModeSalty');
    const btnLang = document.getElementById('btnLang');
    const btnAuto = document.getElementById('btnAuto');
    const btnClear = document.getElementById('btnClear');
    const btnExport = document.getElementById('btnExport');
    const toastEl = document.getElementById('toast');

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
    }

    function applyLang() {
      const zh = lang === 'zh';
      document.documentElement.lang = zh ? 'zh-Hant' : 'en';
      titleEl.textContent = zh ? 'Five Tastes Shibori · 五味紮染' : 'Five Tastes Shibori';
      subEl.textContent = zh
        ? '酸(◎同心圓) · 甜(☁雲霧) · 苦(✦潑墨) · 辣(∴噴霧) · 鹹(〰帶狀) · [1-5] 切換五味 · [R] 自動 · [C] 換布'
        : 'Sour(◎Rings) · Sweet(☁Cloud) · Bitter(✦Ink) · Spicy(∴Spray) · Salty(〰Ribbon) · [1-5] Taste · [R] Auto · [C] Clear';
      btnModeSour.querySelector('.lbl').textContent = zh ? '酸' : 'Sour';
      btnModeSweet.querySelector('.lbl').textContent = zh ? '甜' : 'Sweet';
      btnModeBitter.querySelector('.lbl').textContent = zh ? '苦' : 'Bitter';
      btnModeSpicy.querySelector('.lbl').textContent = zh ? '辣' : 'Spicy';
      btnModeSalty.querySelector('.lbl').textContent = zh ? '鹹' : 'Salty';
      btnLang.textContent = zh ? 'EN' : '中文';
      foodInput.placeholder = zh ? '輸入食物，如：酸辣湯、海鹽焦糖拿鐵、麻辣鍋…' : 'Type a food: hot & sour soup, salted caramel latte…';
      btnFoodPaint.textContent = zh ? 'AI 五味染' : 'AI Taste';
      colorLabelEl.textContent = zh ? '染料色' : 'Dye';
      btnAuto.textContent = zh ? '自動五味' : 'Auto-Taste';
      btnClear.textContent = zh ? '換新棉布' : 'Fresh Cloth';
      btnExport.textContent = zh ? '匯出染布' : 'Export PNG';
    }

    // =========================================================================
    // WebGL Cloud / Mist Tie-Dye Fragment Shader
    // =========================================================================
    const vertSrc = `
      attribute vec2 a_pos;
      varying vec2 v_uv;
      void main() {
        v_uv = a_pos * 0.5 + 0.5;
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }
    `;

    const fragSrc = `
      precision highp float;

      #define MAX_CLOUDS 48

      varying vec2 v_uv;

      uniform vec2  u_res;
      uniform float u_clothSeed;
      uniform int   u_count;
      // x, y (aspect coords), curRadius (smooth capillary soak -> stops), softness
      uniform vec4  u_posRad[MAX_CLOUDS];
      // r, g, b (0..1), density
      uniform vec4  u_colDen[MAX_CLOUDS];
      // x: seed, y: maxRadius, z: unused, w: unused
      uniform vec4  u_extra[MAX_CLOUDS];

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      // Multi-scale irregular spray droplet layer (1-cell jittered, zero grid clipping)
      float sprayDots(vec2 uv, float scale, float seed, float prob, float minR, float maxR, float fiber) {
        vec2 g = uv * scale + vec2(seed * 37.1, seed * 73.7);
        vec2 cell = floor(g);
        vec2 f = fract(g);
        float h1 = hash21(cell + seed * 11.3);
        if (h1 > prob) return 0.0;
        float h2 = hash21(cell + vec2(19.7, 41.3) + seed * 5.7);
        float h3 = hash21(cell + vec2(63.1, 13.9) + seed * 17.1);
        float h4 = hash21(cell + vec2(7.3, 89.1) + seed * 23.3);
        vec2 center = vec2(0.24 + 0.52 * h2, 0.24 + 0.52 * h3);
        // Slightly elliptical / cotton-soaked organic dot shape
        vec2 dd = f - center;
        float dist = length(vec2(dd.x * (0.85 + 0.30 * h4), dd.y * (1.15 - 0.30 * h4)));
        float rad = mix(minR, maxR, h4 * h4) * (0.86 + 0.28 * fiber);
        float alpha = smoothstep(rad, rad * 0.42, dist);
        return alpha * (0.55 + 0.45 * h3);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.52;
        mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
        for (int i = 0; i < 6; i++) {
          v += a * noise(p);
          p = m * p * 2.02;
          a *= 0.49;
        }
        return v;
      }

      void main() {
        vec2 aspect = vec2(u_res.x / u_res.y, 1.0);
        vec2 p = (v_uv - 0.5) * aspect;

        // --- Multi-layer Soft Cloud-Crumpled Cotton Field ---
        // Double domain warp creates natural billowy ice-dye / cloud tie-dye folds!
        vec2 q = vec2(
          fbm(p * 3.1 + u_clothSeed),
          fbm(p * 3.1 + u_clothSeed + vec2(4.7, 1.9))
        );
        vec2 rWarp = vec2(
          fbm(p * 5.4 + 2.4 * q + vec2(1.7, 9.2)),
          fbm(p * 5.4 + 2.4 * q + vec2(8.3, 2.8))
        );

        // Soft cloud folds (white soft-resist misty veins between billowing dye clouds)
        float cloudBase = fbm(p * 4.2 + 1.8 * rWarp + u_clothSeed * 0.3);
        float fineFibers = fbm(p * 18.0 + 0.8 * q);

        // Subtle cotton weave micro-texture
        vec2 tc = gl_FragCoord.xy * 0.52;
        float weave = ((sin(tc.x * 2.5) * 0.5 + 0.5) + (sin(tc.y * 2.5) * 0.5 + 0.5)) * 0.5;
        float grain = (noise(gl_FragCoord.xy * 0.42) - 0.5) * 0.02;

        // Pure crisp white cotton cloth with ultra-soft fold shading
        vec3 col = vec3(0.988, 0.985, 0.976);
        col -= (1.0 - cloudBase) * 0.022;
        col -= weave * 0.011;
        col += grain;

        // Accumulate translucent cloud-dye & splashed-ink washes (subtractive dyeing)
        for (int i = 0; i < MAX_CLOUDS; i++) {
          if (i >= u_count) break;
          vec4 pr = u_posRad[i];
          vec4 cd = u_colDen[i];
          vec4 ex = u_extra[i];

          float curR = pr.z;
          if (curR <= 0.002) continue;
          float mode = pr.w; // 0.0 = Cloud Shibori, 1.0 = Splashed Ink (潑墨)

          vec2 d = p - pr.xy;
          float dyeAmount = 0.0;
          vec3 dyeTint = cd.rgb;

          if (mode < 0.5) {
            // --- MODE 0: CLOUD SHIBORI (雲霧紮染) ---
            vec2 dw = d + (rWarp - 0.5) * (0.14 + curR * 0.32);
            float dist = length(dw);
            float nr = dist / curR;
            float radial = smoothstep(1.18, 0.0, nr);
            radial = radial * radial * (3.0 - 2.0 * radial);

            float localCloud = fbm(p * 5.8 + 1.6 * rWarp + ex.x * 13.0);
            float mistPocket = smoothstep(0.24, 0.78, cloudBase * 0.55 + localCloud * 0.55);
            float feather = mix(0.75, 1.15, fineFibers);
            dyeAmount = clamp(radial * mistPocket * feather * cd.w, 0.0, 0.92);
          } else if (mode < 1.5) {
            // --- MODE 1: SPLASHED INK (潑墨) ---
            // Organic jagged ink splash silhouette + feathered water-ink halo + dark capillary rim
            float theta = atan(d.y, d.x);
            float angWarp = fbm(vec2(cos(theta) * 2.2 + ex.x * 7.0, sin(theta) * 2.2 + ex.x * 5.0));

      }
    };

    // Curated ingredient-level color harmonies for authentic chromatic identity
    const INGREDIENT_PALETTES = [
      { keys: ['薄荷', 'mint', 'mojito', '莫西多'], cloud: ['#2EC4B6', '#28B5F4', '#72EFDD'], ink: ['#0077B6'] },

      { keys: ['咖啡', '拿鐵', '濃縮', '美式', '可可', '巧克力', '焙茶', 'coffee', 'espresso', 'latte', 'chocolate', 'cocoa', 'cacao'], cloud: ['#9C6644', '#B08968', '#7F5539'], ink: ['#18181B', '#3C2317'] },
      { keys: ['紅茶', '烏龍', '珍奶', '奶茶', '伯爵', 'black tea', 'oolong', 'milk tea', 'boba', 'earl grey'], cloud: ['#C67D3B', '#DDA15E', '#9C6644'], ink: ['#4A2511', '#283618'] },
      { keys: ['紅酒', '梅酒', '烏梅', 'wine', 'plum'], cloud: ['#9D0208', '#8338EC', '#B56576'], ink: ['#370617', '#2B193D'] },
      { keys: ['麻辣', '辣椒', '咖哩', '泡菜', '番茄', 'spicy', 'chili', 'mala', 'curry', 'kimchi', 'tomato'], cloud: ['#FF6B00', '#E63946', '#F4A261'], ink: ['#9D0208', '#18181B'] },
      { keys: ['松露', '香菇', '野菇', '高湯', '拉麵', '醬油', 'truffle', 'mushroom', 'ramen', 'soy', 'dashi'], cloud: ['#B08968', '#8D5B4C', '#6C757D'], ink: ['#18181B', '#3D2B1F'] },
      { keys: ['芥末', '哇沙米', '青草', '紫蘇', 'wasabi', 'herbal', 'basil'], cloud: ['#52B788', '#95D5B2', '#D8F3DC'], ink: ['#1B4332', '#2D6A4F'] },
      { keys: ['黑芝麻', '芝麻', '墨魚', '竹炭', 'sesame', 'squid ink', 'charcoal'], cloud: ['#6C757D', '#ADB5BD', '#495057'], ink: ['#18181B', '#212529'] }
    ];

    const RAINBOW_HEX = ['#E6006B', '#FF6B00', '#F0C808', '#2EC4B6', '#28B5F4', '#2B4C7E', '#8338EC'];
    const INK_FALLBACK_HEX = ['#18181B', '#2B4C7E', '#3C2317', '#4A2C6D'];

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function makeSeededRand(seed) {
      let s = seed || 1;
      return () => {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function analyzeFoodFlavor(raw) {
      const text = raw.trim();
      const lower = text.toLowerCase();
      const seed = hashString(lower);
      const sr = makeSeededRand(seed);

      // 1. Score all 8 gustatory axes
      const scores = {};
      let totalScore = 0;
      Object.entries(TASTE_AXES).forEach(([axis, def]) => {
        let hit = 0;
        def.keys.forEach((k) => {
          if (lower.includes(k)) hit += k.length >= 2 ? 1.2 : 0.85;
        });
        scores[axis] = hit;
        totalScore += hit;
      });

      // If no known keywords matched, synthesize a deterministic poetic profile from hash
      const axisNames = Object.keys(TASTE_AXES);
      if (totalScore === 0) {
        const primary = axisNames[seed % axisNames.length];
        const secondary = axisNames[(seed >> 3) % axisNames.length];
        scores[primary] = 1.2;
        if (secondary !== primary) scores[secondary] = 0.7;
        totalScore = scores[primary] + (secondary !== primary ? 0.7 : 0);
      }

      // Normalize weights
      const w = {};
      axisNames.forEach((a) => { w[a] = scores[a] / Math.max(0.001, totalScore); });

      // Top 1..3 dominant axes for display
      const ranked = axisNames
        .filter((a) => scores[a] > 0)
        .sort((a, b) => scores[b] - scores[a])
        .slice(0, 3);

      // 2. Build cloud & ink palettes (ingredient-specific first, then taste-axis colors)
      const cloudPalette = [];
      const inkPalette = [];
      const pushUnique = (arr, hex) => { if (!arr.includes(hex)) arr.push(hex); };

      INGREDIENT_PALETTES.forEach((item) => {
        if (item.keys.some((k) => lower.includes(k))) {
          item.cloud.forEach((c) => pushUnique(cloudPalette, c));
          item.ink.forEach((c) => pushUnique(inkPalette, c));
        }
      });

      ranked.forEach((axis) => {
        const def = TASTE_AXES[axis];
        if (cloudPalette.length < 4) def.cloudColors.forEach((c) => pushUnique(cloudPalette, c));
        if (inkPalette.length < 3) def.inkColors.forEach((c) => pushUnique(inkPalette, c));
      });

      if (cloudPalette.length === 0) {
        cloudPalette.push(RAINBOW_HEX[seed % 7], RAINBOW_HEX[(seed + 2) % 7], RAINBOW_HEX[(seed + 4) % 7]);
      }
      if (inkPalette.length === 0) {
        inkPalette.push(INK_FALLBACK_HEX[seed % INK_FALLBACK_HEX.length]);
      }

      // 3. Derive visual choreography parameters from taste weights
      // Ink ratio: bitter, spicy, umami, roasted push ink up; creamy, sweet, fizzy soften it
      let inkRatio = 0.14
        + w.bitter * 0.36
        + w.spicy * 0.34
        + w.umami * 0.24
        + w.sour * 0.14
        + w.salty * 0.12
        - w.creamy * 0.16
        - w.sweet * 0.10;
      inkRatio = Math.max(0.0, Math.min(0.58, inkRatio));

      // Rhythm / expansion speed
      const speedMult = 1.0
        + w.spicy * 0.55
        + w.sour * 0.38
        + w.fizzy * 0.32
        - w.creamy * 0.24
        - w.umami * 0.18
        - w.sweet * 0.10;

      // Cloud scale & dye density
      const scaleMult = 1.0
        + w.creamy * 0.20
        + w.sweet * 0.14
        - w.fizzy * 0.16
        - w.sour * 0.10;

      const densityBase = 0.78
        + w.bitter * 0.14
        + w.umami * 0.12
        + w.spicy * 0.10
        - w.creamy * 0.14
        - w.fizzy * 0.12;

      // Choose composition layout from dominant axis
      const dominant = ranked[0];
      let layout = 'bloom';
      if (dominant === 'fizzy') layout = 'effervescent';
      else if (dominant === 'spicy') layout = 'burst';
      else if (dominant === 'sour') layout = 'diagonal';
      else if (dominant === 'salty' || dominant === 'bitter' || dominant === 'umami') layout = 'horizon';

      return {
        text, seed, sr, w, ranked,
        cloudPalette, inkPalette,
        inkRatio, speedMult, scaleMult, densityBase, layout
      };
    }

    function dyeFoodCloud(raw) {
      const profile = analyzeFoodFlavor(raw);
      const { text, sr, w, ranked, cloudPalette, inkPalette, inkRatio, speedMult, scaleMult, densityBase, layout } = profile;
      const sRand = (a, b) => a + sr() * (b - a);

      clouds = [];
      dyeQueue = [];
      clothSeed = sr() * 100;
      const aspect = canvas.width / Math.max(1, canvas.height);

      // Direct 1-to-1 Five Tastes -> Five Dyeing Techniques mapping:
      // 酸 Sour -> ◎ 同心圓 (Mode 2)
      // 甜 Sweet -> ☁ 雲霧 (Mode 0)
      // 苦 Bitter -> ✦ 潑墨 (Mode 1)
      // 辣 Spicy -> ∴ 噴霧 (Mode 4)
      // 鹹 Salty -> 〰 帶狀 (Mode 3)
      const fiveWeights = {
        sour:   w.sour + w.fizzy * 0.45,
        sweet:  w.sweet + w.creamy * 0.60,
        bitter: w.bitter + w.umami * 0.35,
        spicy:  w.spicy + w.fizzy * 0.20,
        salty:  w.salty + w.umami * 0.65 + w.fizzy * 0.25
      };
      const fiveSum = Object.values(fiveWeights).reduce((a, b) => a + b, 0) || 1;
      const fiveNorm = {};
      Object.keys(fiveWeights).forEach((k) => { fiveNorm[k] = fiveWeights[k] / fiveSum; });

      const totalPrimary = 10;
      const counts = {
        sour:   Math.round(totalPrimary * fiveNorm.sour),
        sweet:  Math.round(totalPrimary * fiveNorm.sweet),
        bitter: Math.round(totalPrimary * fiveNorm.bitter),
        spicy:  Math.round(totalPrimary * fiveNorm.spicy),
        salty:  Math.round(totalPrimary * fiveNorm.salty)
      };
      // Ensure any active core taste gets at least 1 gesture, and keep total clean (8..11)
      const coreOrder = ['sour', 'sweet', 'bitter', 'spicy', 'salty'];
      coreOrder.forEach((k) => {
        if (fiveWeights[k] > 0.14 && counts[k] === 0) counts[k] = 1;
      });
      // Cap high-density ink/ring gestures so canvas stays breathable and painterly
      counts.bitter = Math.min(3, counts.bitter);
      counts.sour = Math.min(3, counts.sour);
      counts.spicy = Math.min(4, counts.spicy);
      counts.salty = Math.min(4, counts.salty);
      counts.sweet = Math.min(5, counts.sweet);

      const cloudCount  = counts.sweet;  // 甜 -> Mode 0 (雲霧)
      const inkCount    = counts.bitter; // 苦 -> Mode 1 (潑墨)
      const ringCount   = counts.sour;   // 酸 -> Mode 2 (同心圓)
      const ribbonCount = counts.salty;  // 鹹 -> Mode 3 (帶狀)
      const sprayCount  = counts.spicy;  // 辣 -> Mode 4 (噴霧)

      // Helper to generate composition coordinates by flavor layout
      function pickPoint(index, total, isInk) {
        const t = total > 1 ? index / (total - 1) : 0.5;
        if (layout === 'horizon') {
          // Layered landscape band (salty / bitter / umami)
          const x = ((t - 0.5) * 0.84 + sRand(-0.09, 0.09)) * aspect;
          const y = isInk ? sRand(-0.22, 0.08) : sRand(-0.26, 0.28);
          return [x, y];
        }
        if (layout === 'diagonal') {
          // Lively diagonal citrus sweep (sour)
          const u = (t - 0.5) * 0.86;
          const x = (u + sRand(-0.11, 0.11)) * aspect;
          const y = u * 0.72 + sRand(-0.14, 0.14);
          return [x, y];
        }
        if (layout === 'burst') {
          // Energetic core-to-outer radial bursts (spicy)
          const ang = t * Math.PI * 2 + sRand(-0.35, 0.35);
          const rad = isInk ? sRand(0.04, 0.28) : sRand(0.10, 0.38);
          return [Math.cos(ang) * rad * aspect, Math.sin(ang) * rad];
        }
        if (layout === 'effervescent') {
          // Rising mist & sparkling droplets (fizzy / mint)
          const x = sRand(-0.42, 0.42) * aspect;
          const y = -0.34 + t * 0.68 + sRand(-0.08, 0.08);
          return [x, y];
        }
        // Soft billowing cluster (sweet / creamy)
        const ang = t * Math.PI * 2 + sRand(-0.45, 0.45);
        const rad = sRand(0.06, 0.34);
        return [Math.cos(ang) * rad * aspect, Math.sin(ang) * rad];
      }

      const frameGap = Math.max(5, Math.round(9 / Math.max(0.65, speedMult)));
      let curFrame = 2;

      // Stage 1: Lay down atmospheric Cloud Shibori washes
      for (let i = 0; i < cloudCount; i++) {
        const [x, y] = pickPoint(i, cloudCount, false);
        dyeQueue.push({
          frame: curFrame,
          mode: 0,
          x,
          y,
          hex: cloudPalette[i % cloudPalette.length],
          maxR: sRand(0.36, 0.58) * scaleMult,
          rate: sRand(0.018, 0.030) * speedMult,
          density: Math.max(0.48, Math.min(0.92, densityBase + sRand(-0.10, 0.08)))
        });
        curFrame += frameGap;
      }

      // Stage 1a: Layer Banded Ribbon Wash (帶狀暈染) sweeping gracefully across the cloth
      for (let rIdx = 0; rIdx < ribbonCount; rIdx++) {
        const yOff = (rIdx - (ribbonCount - 1) * 0.5) * 0.28 + sRand(-0.08, 0.08);
        const tilt = layout === 'diagonal' ? sRand(0.28, 0.52) : sRand(-0.24, 0.24);
        dyeQueue.push({
          frame: curFrame,
          mode: 3,
          x: sRand(-0.18, 0.18) * aspect,
          y: yOff,
          hex: cloudPalette[(rIdx + 2) % cloudPalette.length],
          maxR: sRand(0.28, 0.40) * scaleMult,
          rate: sRand(0.024, 0.038) * speedMult,
          density: Math.max(0.64, Math.min(0.90, densityBase)),
          angle: tilt
        });
        curFrame += frameGap;
      }

      // Stage 1b: Layer Concentric Shibori (同心圓紮染) motifs for rhythmic/layered flavors
      for (let k = 0; k < ringCount; k++) {
        const [x, y] = pickPoint(k, Math.max(2, ringCount), false);
        dyeQueue.push({
          frame: curFrame,
          mode: 2,
          x: x * 0.85,
          y: y * 0.85,
          hex: cloudPalette[(k + 1) % cloudPalette.length],
          maxR: sRand(0.18, 0.32) * scaleMult,
          rate: sRand(0.028, 0.044) * speedMult,
          density: Math.max(0.72, Math.min(0.94, densityBase + 0.06))
        });
        curFrame += frameGap;
      }

      // Stage 2: Layer flavor-driven Splashed Ink accents (bitter / spicy / umami / sour tang)
      for (let j = 0; j < inkCount; j++) {
        const [x, y] = pickPoint(j, inkCount, true);
        const isSpicy = w.spicy > 0.22;
        const isSour = w.sour > 0.25 && !isSpicy;
        dyeQueue.push({
          frame: curFrame + 2,
          mode: 1,
          x,
          y,
          hex: inkPalette[j % inkPalette.length],
          maxR: isSour ? sRand(0.07, 0.13) : sRand(0.12, 0.21),
          rate: sRand(0.055, 0.085) * speedMult,
          density: Math.max(0.70, Math.min(0.96, densityBase + 0.10)),
          satCount: isSpicy ? 6 : (isSour ? 4 : 3),
          satSpread: isSpicy ? 1.35 : 1.0
        });
        curFrame += Math.max(6, frameGap + 1);
      }

      // Stage 2b: Layer Irregular Dotted Spray (不規則點狀噴霧) for effervescent/zesty/spiced accents
      for (let sp = 0; sp < sprayCount; sp++) {
        const [x, y] = pickPoint(sp, Math.max(2, sprayCount), true);
        dyeQueue.push({
          frame: curFrame + 2,
          mode: 4,
          x: x * 0.9,
          y: y * 0.9,
          hex: (sp % 2 === 0 ? cloudPalette : inkPalette)[sp % cloudPalette.length] || cloudPalette[0],
          maxR: sRand(0.24, 0.38) * scaleMult,
          rate: sRand(0.065, 0.105) * speedMult,
          density: Math.max(0.76, Math.min(0.95, densityBase + 0.08)),
          angle: sRand(-0.8, 0.8)
        });
        curFrame += Math.max(5, frameGap);
      }

      // Stage 3: Extra crisp effervescent micro-droplets for fizzy/sparkling drinks
      if (w.fizzy > 0.22) {
        const bubbles = 5;
        for (let b = 0; b < bubbles; b++) {
          dyeQueue.push({
            frame: curFrame + b * 4,
            mode: 1,
            isSatellite: true,
            x: sRand(-0.38, 0.38) * aspect,
            y: sRand(-0.22, 0.36),
            hex: cloudPalette[b % cloudPalette.length],
            maxR: sRand(0.014, 0.032),
            rate: sRand(0.08, 0.12),
            density: sRand(0.62, 0.84)
          });
        }
      }

      queueFrame = 0;

      // Sync active swatch to primary cloud hue so manual follow-up harmonizes
      setActiveColor(cloudPalette[0]);

      const zh = lang === 'zh';
      const denom = Math.max(1, cloudCount + ribbonCount + ringCount + sprayCount + inkCount);
      const tasteMeta = [
        { k: 'sour',   cnt: ringCount,   zh: '酸', en: 'Sour',   sym: '◎' },
        { k: 'sweet',  cnt: cloudCount,  zh: '甜', en: 'Sweet',  sym: '☁' },
        { k: 'bitter', cnt: inkCount,    zh: '苦', en: 'Bitter', sym: '✦' },
        { k: 'spicy',  cnt: sprayCount,  zh: '辣', en: 'Spicy',  sym: '∴' },
        { k: 'salty',  cnt: ribbonCount, zh: '鹹', en: 'Salty',  sym: '〰' }
      ].filter((t) => t.cnt > 0).sort((a, b) => b.cnt - a.cnt);

      const mixParts = tasteMeta.map((t) => {
        const pct = Math.round((t.cnt / denom) * 100);
        return `${t.sym}${zh ? t.zh : t.en} ${pct}%`;
      });
      const topLabels = tasteMeta.slice(0, 3).map((t) => (zh ? t.zh : t.en)).join('・');

      titleEl.textContent = zh ? `${text} · 五味紮染` : `${text} · Five Tastes Shibori`;
      subEl.textContent = zh
        ? `五味配方：${mixParts.join(' · ')}`
        : `Taste weave: ${mixParts.join(' · ')}`;
      showToast(zh ? `正在依「${topLabels}」五味技法染製「${text}」…` : `Dyeing “${text}” (${topLabels})…`);
    }

    function scheduleAutoCloud() {
      clouds = [];
      dyeQueue = [];
      clothSeed = Math.random() * 100;
      applyLang();
      const aspect = canvas.width / Math.max(1, canvas.height);

      // Dreamy clouds + flowing ribbon wash + concentric shibori rings + mist spray + splashed-ink accents
      const preset = [
        { f:  2, mode: 0, hex: '#28B5F4', x: -0.22 * aspect, y:  0.14, maxR: 0.56, den: 0.80 },
        { f: 12, mode: 0, hex: '#2EC4B6', x: -0.02 * aspect, y:  0.24, maxR: 0.48, den: 0.74 },
        { f: 22, mode: 3, hex: '#8338EC', x:  0.04 * aspect, y:  0.06, maxR: 0.35, den: 0.74, angle: 0.22 },
        { f: 32, mode: 0, hex: '#E6006B', x: -0.18 * aspect, y: -0.20, maxR: 0.44, den: 0.68 },
        { f: 42, mode: 2, hex: '#2B4C7E', x: -0.16 * aspect, y:  0.02, maxR: 0.25, den: 0.88 },
        { f: 52, mode: 4, hex: '#E6006B', x:  0.18 * aspect, y:  0.16, maxR: 0.34, den: 0.90, angle: -0.35 },
        { f: 62, mode: 1, hex: '#18181B', x:  0.10 * aspect, y: -0.04, maxR: 0.15, den: 0.94 },
        { f: 70, mode: 4, hex: '#28B5F4', x: -0.04 * aspect, y: -0.16, maxR: 0.30, den: 0.88, angle: 0.45 }
      ];
      preset.forEach((c) => {
        dyeQueue.push({
          frame: c.f,
          mode: c.mode,
          x: c.x + rand(-0.04, 0.04),
          y: c.y + rand(-0.04, 0.04),
          hex: c.hex,
          maxR: c.maxR,
          density: c.den,
          angle: c.angle
        });
      });
      queueFrame = 0;
    }

    // UI & Pointer Bindings

    function setActiveColor(hex, fromInput = false) {
      activeColorHex = hex.toUpperCase();
      if (!fromInput) customColorEl.value = activeColorHex;
      hexReadoutEl.textContent = activeColorHex;
      swatchBtns.forEach((b) => b.classList.toggle('active', b.dataset.hex.toUpperCase() === activeColorHex));
    }

    function setActiveMode(m) {
      activeMode = m;
      modeBtns.forEach((b) => b.classList.toggle('active', Number(b.dataset.mode) === m));
    }

    modeBtns.forEach((b) => b.addEventListener('click', () => setActiveMode(Number(b.dataset.mode))));
    swatchBtns.forEach((b) => b.addEventListener('click', () => setActiveColor(b.dataset.hex)));
    customColorEl.addEventListener('input', (e) => setActiveColor(e.target.value, true));

    foodForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = foodInput.value.trim();
      if (!val) { scheduleAutoCloud(); return; }
      dyeFoodCloud(val);
      foodInput.blur();
    });

    btnAuto.addEventListener('click', () => {
      scheduleAutoCloud();
      showToast(lang === 'zh' ? '正在重新暈染雲霧棉布…' : 'Blooming fresh cloud cloth…');
    });

    btnClear.addEventListener('click', () => {
      clouds = [];
      dyeQueue = [];
      clothSeed = Math.random() * 100;
      applyLang();
      showToast(lang === 'zh' ? '已換上全新純白棉布' : 'Fresh white cotton cloth ready');
    });

    btnLang.addEventListener('click', () => {
      lang = lang === 'zh' ? 'en' : 'zh';
      applyLang();
    });

    btnExport.addEventListener('click', () => {
      const prevW = canvas.width, prevH = canvas.height;
      const size = 2400;
      canvas.width = size;
      canvas.height = size;
      gl.viewport(0, 0, size, size);
      renderGL(size, size);
      canvas.toBlob((blob) => {
        if (blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `cloud_shibori_${Date.now()}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast(lang === 'zh' ? '已匯出 2400×2400 雲霧紮染 PNG' : 'Exported 2400×2400 Cloud Shibori PNG');
        }
        canvas.width = prevW;
        canvas.height = prevH;
        gl.viewport(0, 0, prevW, prevH);
        renderGL(prevW, prevH);
      }, 'image/png');
    });

    let isDown = false;
    let lastPt = null;

    function clientToAspect(cx, cy) {
      const rect = canvas.getBoundingClientRect();
      const nx = (cx - rect.left) / rect.width;
      const ny = 1.0 - (cy - rect.top) / rect.height;
      const aspect = rect.width / Math.max(1, rect.height);
      return [(nx - 0.5) * aspect, ny - 0.5];
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDown = true;
      const [ax, ay] = clientToAspect(e.clientX, e.clientY);
      addCloud(ax, ay, activeColorHex);
      lastPt = [ax, ay];
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDown) return;
      const [ax, ay] = clientToAspect(e.clientX, e.clientY);
      const stepDist = activeMode === 4 ? 0.10 : (activeMode === 1 ? 0.12 : (activeMode === 2 ? 0.22 : (activeMode === 3 ? 0.18 : 0.16)));
      if (!lastPt || Math.hypot(ax - lastPt[0], ay - lastPt[1]) > stepDist) {
        const dragMaxR = activeMode === 4 ? rand(0.14, 0.24) : (activeMode === 1 ? rand(0.08, 0.16) : (activeMode === 2 ? rand(0.12, 0.22) : (activeMode === 3 ? rand(0.16, 0.26) : rand(0.28, 0.48))));
        const strokeAngle = ((activeMode === 3 || activeMode === 4) && lastPt) ? Math.atan2(ay - lastPt[1], ax - lastPt[0]) : undefined;
        addCloud(ax, ay, activeColorHex, { maxR: dragMaxR, satCount: activeMode === 1 ? 2 : 0, angle: strokeAngle });
        lastPt = [ax, ay];
      }
    });

    window.addEventListener('pointerup', () => { isDown = false; lastPt = null; });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const k = e.key.toLowerCase();
      if (k === '1') setActiveMode(2);      // 1: 酸 Sour (同心圓)
      else if (k === '2') setActiveMode(0); // 2: 甜 Sweet (雲霧)
      else if (k === '3') setActiveMode(1); // 3: 苦 Bitter (潑墨)
      else if (k === '4') setActiveMode(4); // 4: 辣 Spicy (噴霧)
      else if (k === '5') setActiveMode(3); // 5: 鹹 Salty (帶狀)
      else if (k === 'h') document.body.classList.toggle('ui-hidden');
      else if (k === 'r') btnAuto.click();
      else if (k === 'c') btnClear.click();
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(window.innerWidth * dpr);
      const h = Math.floor(window.innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    // =========================================================================
    // Render Loop
    // =========================================================================
    const posRadArr = new Float32Array(MAX_CLOUDS * 4);
    const colDenArr = new Float32Array(MAX_CLOUDS * 4);
    const extraArr = new Float32Array(MAX_CLOUDS * 4);

    function renderGL(w, h) {
      const n = Math.min(clouds.length, MAX_CLOUDS);
      for (let i = 0; i < MAX_CLOUDS; i++) {
        if (i < n) {
          const c = clouds[i];
          posRadArr[i * 4 + 0] = c.x;
          posRadArr[i * 4 + 1] = c.y;
          posRadArr[i * 4 + 2] = c.r;
          posRadArr[i * 4 + 3] = c.mode || 0;

          colDenArr[i * 4 + 0] = c.rgb[0];
          colDenArr[i * 4 + 1] = c.rgb[1];
          colDenArr[i * 4 + 2] = c.rgb[2];
          colDenArr[i * 4 + 3] = c.density;

          extraArr[i * 4 + 0] = c.seed;
          extraArr[i * 4 + 1] = c.maxR;
          extraArr[i * 4 + 2] = c.angle || 0;
          extraArr[i * 4 + 3] = 0;
        } else {
          posRadArr[i * 4 + 2] = 0;
        }
      }

      gl.uniform2f(uRes, w, h);
      gl.uniform1f(uClothSeed, clothSeed);
      gl.uniform1i(uCount, n);
      gl.uniform4fv(uPosRad, posRadArr);
      gl.uniform4fv(uColDen, colDenArr);
      gl.uniform4fv(uExtra, extraArr);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    function tick() {
      if (dyeQueue.length > 0) {
        queueFrame++;
        while (dyeQueue.length > 0 && dyeQueue[0].frame <= queueFrame) {
          const item = dyeQueue.shift();
          addCloud(item.x, item.y, item.hex, {
            mode: item.mode !== undefined ? item.mode : 0,
            maxR: item.maxR,
            rate: item.rate,
            density: item.density,
            isSatellite: item.isSatellite,
            satCount: item.satCount,
            satSpread: item.satSpread,
            angle: item.angle
          });
        }
      }

      // Smooth billowy expansion -> naturally decelerates & stops!
      for (let i = 0; i < clouds.length; i++) {
        const c = clouds[i];
        const delta = (c.maxR - c.r) * c.rate;
        if (delta > 0.00012) c.r += delta;
        else c.r = c.maxR;
      }

      renderGL(canvas.width, canvas.height);
      requestAnimationFrame(tick);
    }

    applyLang();
    scheduleAutoCloud();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
